{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <h1 class="h3 mb-3">Change password</h1>
  <form method="post" class="panel">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="current">Current password</label><input class="form-control" id="current" name="current" type="password" required autocomplete="current-password"></div>
    <div class="mb-3"><label class="form-label" for="new">New password</label><input class="form-control" id="new" name="new" type="password" minlength="8" required autocomplete="new-password"><div class="form-text">At least 8 characters.</div></div>
    <div class="mb-3"><label class="form-label" for="confirm">Repeat new password</label><input class="form-control" id="confirm" name="confirm" type="password" minlength="8" required autocomplete="new-password"></div>
    <button class="btn btn-primary">Save new password</button>
  </form>
</div></div>
{% endblock %}
