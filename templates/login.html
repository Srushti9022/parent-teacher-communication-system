{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <h1 class="h3 mb-1 mt-4">Smart School Portal</h1>
  <p class="text-muted">Sign in with your school email address.</p>
  <form method="post" class="panel" novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" name="email" type="email" value="{{ request.form.get('email', '') }}" required autofocus autocomplete="username"></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary w-100">Sign in</button>
  </form>
  <p class="text-muted small mt-3">Admin, teacher and parent accounts can sign in. Forgotten your password? Ask the school office.</p>
</div></div>
{% endblock %}
